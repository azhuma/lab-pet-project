spring.application.name=lab-pet-project
spring.h2.console.enabled=true
flyway.enabled=false

#spring.security.user.name=user
#spring.security.user.password=password
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

#logging.level.root=error
#logging.level.org.springframework.web=error
#logging.level.kz.lab.petproject=error
#logging.level.kz.lab.petproject.runner=debug

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.acks=1
spring.kafka.producer.properties.retries=3
#spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
#spring.kafka.producer.properties.enable.idempotence=true

# Configuration for default Redis connection (DB 0)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# Configuration for database 1 connection
redis-db1.host=localhost
redis-db1.port=6379
redis-db1.database=1

management.endpoints.web.exposure.include=health,info,metrics,prometheus

